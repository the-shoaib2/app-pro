name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install GTK4 dependencies
      run: sudo apt-get update && sudo apt-get install -y
        libgtk-4-dev libgraphene-1.0-dev libvulkan-dev
        libwayland-dev libxkbcommon-dev libepoxy-dev
        libharfbuzz-dev libfontconfig-dev libfreetype-dev
        libfribidi-dev libpixman-1-dev libpng-dev
        libmount-dev libselinux-dev libseccomp-dev

    - name: Cache cargo dependencies
      uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --release --verbose

    - name: Test
      run: cargo test --verbose

    - name: Strip binary
      run: strip target/release/app-pro

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-pro-linux-x86_64
        path: target/release/app-pro

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: target/release/app-pro
