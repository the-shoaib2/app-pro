name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release App Pro
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install GTK4 & System Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-4-dev libgraphene-1.0-dev libvulkan-dev \
          libwayland-dev libxkbcommon-dev libepoxy-dev \
          libharfbuzz-dev libfontconfig-dev libfreetype-dev \
          libfribidi-dev libpixman-1-dev libpng-dev \
          libmount-dev libselinux-dev libseccomp-dev

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-release-

    - name: Build Production Release (x86_64)
      run: cargo build --release --verbose

    - name: Prepare Release Asset
      run: |
        mkdir -p dist
        cp target/release/app-pro dist/app-pro-linux-x86_64
        strip dist/app-pro-linux-x86_64
        cd dist
        sha256sum app-pro-linux-x86_64 > app-pro-linux-x86_64.sha256

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: App Pro Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          dist/app-pro-linux-x86_64
          dist/app-pro-linux-x86_64.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
