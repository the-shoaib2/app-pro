name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release App Pro
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install GTK4 & System Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-4-dev libgraphene-1.0-dev libvulkan-dev \
          libwayland-dev libxkbcommon-dev libepoxy-dev \
          libharfbuzz-dev libfontconfig-dev libfreetype-dev \
          libfribidi-dev libpixman-1-dev libpng-dev \
          libmount-dev libselinux-dev libseccomp-dev

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Auto-Bump Version and Tag (on push to main)
      if: github.ref == 'refs/heads/main'
      id: bump_version
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
        echo "Current version: $VERSION"

        IFS='.' read -r major minor patch <<< "$VERSION"
        NEW_PATCH=$((patch + 1))
        NEW_VERSION="${major}.${minor}.${NEW_PATCH}"
        echo "New version: $NEW_VERSION"

        sed -i "s/^version = \"$VERSION\"/version = \"$NEW_VERSION\"/" Cargo.toml
        cargo check

        git add Cargo.toml Cargo.lock
        git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
        
        TAG_NAME="v$NEW_VERSION"
        git tag "$TAG_NAME"
        git push origin main
        git push origin "$TAG_NAME"

        echo "new_tag=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "is_bumped=true" >> $GITHUB_OUTPUT

    - name: Cache Cargo Dependencies
      uses: Swatinem/rust-cache@v2

    - name: Build Production Release (x86_64)
      run: cargo build --release --verbose

    - name: Prepare Release Asset
      run: |
        mkdir -p dist
        cp target/release/app-pro dist/app-pro-linux-x86_64
        strip dist/app-pro-linux-x86_64
        cd dist
        sha256sum app-pro-linux-x86_64 > app-pro-linux-x86_64.sha256

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.bump_version.outputs.is_bumped == 'true' && steps.bump_version.outputs.new_tag || github.ref_name }}
        name: App Pro Release ${{ steps.bump_version.outputs.is_bumped == 'true' && steps.bump_version.outputs.new_tag || github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          dist/app-pro-linux-x86_64
          dist/app-pro-linux-x86_64.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
