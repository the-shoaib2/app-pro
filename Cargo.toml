[package]
name = "app-pro"
version = "1.0.0"
edition = "2021"
description = "Unified Linux system utility: installer, uninstaller, cleaner, process manager, and app dashboard"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "5"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
